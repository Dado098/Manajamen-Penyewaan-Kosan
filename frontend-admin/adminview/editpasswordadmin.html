<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Password | SenangKos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../css/adminstyle.css" />
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-container">
      <img src="../images/logosenangkos.svg" alt="Logo" class="logo">
    </div>
    <ul class="sidebar-menu">
      <li>
        <a href="indexadmin.html" class="sidebar-link">
          <img src="../images/icon-home.svg" class="icon">
          <span class="sidebar-text">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="manajemenkamar.html" class="sidebar-link">
          <img src="../images/icon-mkamar.svg" class="icon">
          <span class="sidebar-text">Manajemen Kamar</span>
        </a>
      </li>
      <li>
        <a href="manajemenkeuangan.html" class="sidebar-link">
          <img src="../images/icon-mkeuangan.svg" class="icon">
          <span class="sidebar-text">Manajemen Keuangan</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Konten -->
  <div class="content-wrapper">
    <header>
      <div class="header-buttons-row">
        <div class="header-buttons">
          <button class="btn-green" onclick="window.location.href='../../frontend-user/html/homepage.html'">Lihat Web</button>
          <button class="btn-red" id="logoutBtn">Logout</button>
        </div>
      </div>
      <div class="greeting">
        <h2>Profil</h2>
        <p>Edit Password</p>
      </div>
    </header>

    <div class="main-content">
      <section class="form-kamar">
        <h3>Ubah Password</h3>
        <form class="form-container" id="password-form">
          <!-- <div class="form-group">
            <label for="current-password">Password Saat Ini</label>
            <input type="password" id="current-password" placeholder="Masukkan password saat ini" required />
          </div> -->

          <div class="form-group">
            <label for="new-password">Password Baru</label>
            <input type="password" id="new-password" placeholder="Masukkan password baru" required />
          </div>

          <div class="form-group">
            <label for="confirm-password">Konfirmasi Password</label>
            <input type="password" id="confirm-password" placeholder="Konfirmasi password baru" required />
          </div>

          <div class="form-buttons">
            <button type="submit" class="btn-green">Simpan Password</button>
            <button type="reset" class="btn-red">Batal</button>
          </div>
        </form>
      </section>
    </div>
  </div>

  <script>
    const currentPage = window.location.pathname.split("/").pop();
    document.querySelectorAll(".sidebar-link").forEach(link => {
      if (link.getAttribute("href") === currentPage) {
        link.classList.add("active");
      }
    });
  </script>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>

  <script>
    $(document).ready(function () {
      const token = localStorage.getItem("token");
      const role = localStorage.getItem("role");
      if (!token) {
        Swal.fire({
          icon: 'error',
          title: 'Gagal!',
          text: 'Anda harus login terlebih dahulu.',
          allowOutsideClick: false,
          allowEscapeKey: false
        }).then(() => {
          window.location.href = '../../frontend-user/html/login.html';
        });
        return; // Stop semua eksekusi script
      }
      // Logout
      $('#logoutBtn').click(function () {
        Swal.fire({
          title: 'Konfirmasi',
          text: "Anda yakin ingin logout?",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'Ya, logout!'
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.removeItem("token");
            localStorage.removeItem("role");
            Swal.fire({
              title: 'Berhasil!',
              text: 'Anda telah logout.',
              icon: 'success',
              timer: 1500,
              showConfirmButton: false
            }).then(() => {
              window.location.href = '../../frontend-admin/adminview/indexadmin.html';
            });
          }
        });
      });
      // Cek token & role "pemilik"
      if (!token || role !== 'pemilik') {
        Swal.fire({
          icon: 'error',
          title: 'Akses Ditolak',
          text: 'Hanya pemilik yang diizinkan mengakses halaman ini.',
          allowOutsideClick: false
        }).then(() => {
          window.location.href = 'indexadmin.html';
        });
        return;
      }

     $('#password-form').on('submit', function (e) {
      e.preventDefault();

      const newPassword = $('#new-password').val().trim();
      const confirmPassword = $('#confirm-password').val().trim();
      const token = localStorage.getItem('token');

      if (!newPassword || !confirmPassword) {
        Swal.fire({
          icon: 'warning',
          title: 'Peringatan',
          text: 'Semua kolom wajib diisi.'
        });
        return;
      }

      if (newPassword !== confirmPassword) {
        Swal.fire({
          icon: 'error',
          title: 'Oops...',
          text: 'Password dan konfirmasi tidak cocok.'
        });
        return;
      }

      $.ajax({
        url: 'http://localhost:8000/api/users/update-password',
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`
        },
        data: {
          password: newPassword,
          password_confirmation: confirmPassword
        },
        success: function () {
          Swal.fire({
            icon: 'success',
            title: 'Berhasil',
            text: 'Password berhasil diperbarui.'
          }).then(() => {
            window.location.href = 'indexadmin.html';
          });
        },
        error: function (xhr) {
          let msg = 'Gagal memperbarui password.';
          if (xhr.status === 403) {
            msg = 'Anda tidak memiliki izin.';
          } else if (xhr.status === 422 && xhr.responseJSON?.errors) {
            const errors = xhr.responseJSON.errors;
            msg = Object.values(errors).flat().join('\n');
          } else if (xhr.responseJSON?.message) {
            msg = xhr.responseJSON.message;
          }

          Swal.fire({
            icon: 'error',
            title: 'Gagal',
            text: msg
          });
        }
      });
    });
  });
  </script>
</body>
</html>
