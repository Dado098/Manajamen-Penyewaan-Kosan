<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Kamar | SenangKos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/adminstyle.css" />
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
</head>
<body>
  <div class="sidebar">
    <div class="logo-container">
      <img src="../images/logosenangkos.svg" alt="Logo" class="logo">
    </div>
        <button class="close-sidebar-btn" id="closeSidebarBtn">&times;</button>
    <ul class="sidebar-menu">
      <li>
        <a href="indexadmin.html" class="sidebar-link">
          <img src="../images/icon-home.svg" class="icon">
          <span class="sidebar-text">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="manajemenkamar.html" class="sidebar-link">
          <img src="../images/icon-mkamar.svg" class="icon">
          <span class="sidebar-text">Manajemen Kamar</span>
        </a>
      </li>
      <li>
        <a href="manajemenkeuangan.html" class="sidebar-link">
          <img src="../images/icon-mkeuangan.svg" class="icon">
          <span class="sidebar-text">Manajemen Keuangan</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="content-wrapper">
    <header>
      <div class="header-buttons-row">
        <span class="sidebar-toggle" id="sidebarToggle">&#9776;</span>
        <div class="header-buttons">
          <button class="btn-green" onclick="window.location.href='../../frontend-user/html/homepage.html'">Lihat Web</button>
          <button class="btn-red" id="logoutBtn">Logout</button>
        </div>
      </div>
      <div class="greeting">
        <h2>Manajemen Kamar</h2>
        <p>Kelola kamar kos Anda dengan mudah</p>
      </div>
    </header>

    <div class="main-content">
      <section class="summary">
        <div class="summary-header">
          <h3>Daftar Kamar</h3>
          <div class="table-actions-left">
            <a href="manajemenkamar-post.html" class="btn-blue" th:href="@{/manajemenkamar-post.html (id=${reach.id})}">Tambah</a>
            <button class="btn-green" id="customExportBtn">Ekspor</button>
          </div>
        </div>
        <div class="room-table-wrapper">
          <table id="table-kamar" class="display">
            <thead>
              <tr>
                <th>No. Kamar</th>
                <th>Status</th>
                <th>Harga</th>
                <th>Fasilitas</th>
                <th>Foto</th>
                <th>Luas</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="kamar-table-body">
              <!-- Baris kamar akan dimuat otomatis -->
            </tbody>
          </table>
        </div>
      </section>

      <section class="pemesanan">
        <h3>Daftar Pemesanan</h3>
        <div class="table-actions-left">
          <button class="btn-green" id="customExportBtnPemesanan">Ekspor</button>
        </div>
        <table id="table-pemesanan" class="display">
          <thead>
            <tr>
              <th>No. Pemesanan</th>
              <th>No. Kamar</th>
              <th>Tanggal Masuk</th>
              <th>Tanggal Keluar</th>
              <th>Tanggal Pemesanan</th>
            </tr>
          </thead>
          <tbody id="pemesanan-table-body">
            <!-- Pemesanans akan dimuat otomatis -->
          </tbody>
        </table>
      </section>
    </div>
  </div>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

  <script>
    $(document).ready(function () {
      const token = localStorage.getItem("token");
      if (!token) {
        Swal.fire({
          icon: 'error',
          title: 'Gagal!',
          text: 'Anda harus login terlebih dahulu.',
          allowOutsideClick: false,
          allowEscapeKey: false
        }).then(() => {
          window.location.href = '../../frontend-user/html/login.html';
        });
        return; // Stop semua eksekusi script
      }
      // Logout handler
      $('#logoutBtn').click(function () {
        Swal.fire({
          title: 'Konfirmasi',
          text: "Anda yakin ingin logout?",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Ya, logout!'
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.removeItem("token");
            Swal.fire({
              title: 'Berhasil!',
              text: 'Anda telah logout.',
              icon: 'success',
              timer: 1500,
              showConfirmButton: false
            }).then(() => {
              window.location.href = '../../frontend-user/html/login.html';
            });
          }
        });
      });
  
      // Ambil data kamar
      $.ajax({
        url: 'http://localhost:8000/api/kamars',
        method: 'GET',
        success: function (response) {
          const tbody = $('#kamar-table-body');
          tbody.empty();
  
          response.forEach((kamar) => {
            const badge = kamar.status === 'Terisi'
              ? '<span class="badge badge-red">Terisi</span>'
              : '<span class="badge badge-green">Kosong</span>';
  
            const row = `
              <tr>
                <td data-label="No. Kamar">${kamar.id}</td>
                <td data-label="Status">${badge}</td>
                <td data-label="Harga">Rp${parseInt(kamar.harga).toLocaleString('id-ID')}</td>
                <td data-label="Fasilitas">${kamar.fasilitas || '-'}</td>
                <td data-label="Foto">
                  <img src="http://localhost:8000/storage/${kamar.image}" alt="Foto Kamar ${kamar.id}" style="max-width: 100px; height: auto;">
                </td>
                <td data-label="Luas">${kamar.luas} m²</td>
                <td data-label="Aksi">
                  <a href="manajemenkamar-update.html?id=${kamar.id}" class="btn-action edit" data-id="${kamar.id}">Edit</a>
                  <button class="btn-action delete" onclick="deleteKamar(${kamar.id}, this)">Hapus</button>
                </td>
              </tr>`;
            tbody.append(row);
          });
  
          const currentDateTime = new Date().toLocaleString('id-ID', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
  
          const dataTable = $("#table-kamar").DataTable({
            dom: 'lfrtip',
            buttons: [
              {
                extend: 'excelHtml5',
                title: `Data Kamar Kos - ${currentDateTime}`,
                exportOptions: {
                  columns: ':not(.no-export)'
                }
              },
              {
                extend: 'pdfHtml5',
                title: `Data Kamar Kos - ${currentDateTime}`,
                exportOptions: {
                  columns: ':not(.no-export)'
                },
                orientation: 'landscape',
                pageSize: 'A4'
              }
            ],
            responsive: true,
            pageLength: 5,
            language: {
              url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/id.json"
            }
          });
  
          $('#customExportBtn').on('click', function () {
            Swal.fire({
              title: 'Pilih Format Ekspor',
              showDenyButton: true,
              showCancelButton: true,
              confirmButtonText: 'Excel',
              denyButtonText: `PDF`,
              cancelButtonText: 'Batal'
            }).then((result) => {
              if (result.isConfirmed) {
                dataTable.button('.buttons-excel').trigger();
              } else if (result.isDenied) {
                dataTable.button('.buttons-pdf').trigger();
              }
            });
          });
        },
        error: function (err) {
          console.error("Gagal memuat data kamar:", err);
        }
      });
  
      // Ambil data pemesanan
      $.ajax({
        url: 'http://localhost:8000/api/pemesanans',
        method: 'GET',
        success: function (response) {
          const tbody = $('#pemesanan-table-body');
          tbody.empty();
  
          response.forEach((pemesanan, index) => {
            const row = `
              <tr>
                <td>${index + 1}</td>
                <td>${pemesanan.kamar_id}</td>
                <td>${pemesanan.tgl_masuk}</td>
                <td>${pemesanan.tgl_keluar}</td>
                <td>${pemesanan.created_at}</td>
              </tr>`;
            tbody.append(row);
          });
  
          const currentDateTime = new Date().toLocaleString('id-ID', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
  
          const pemesananDataTable = $('#table-pemesanan').DataTable({
            dom: 'lfrtip',
            buttons: [
              {
                extend: 'excelHtml5',
                title: `Data Pemesanan Kos - ${currentDateTime}`,
                exportOptions: {
                  columns: ':not(.no-export)'
                }
              },
              {
                extend: 'pdfHtml5',
                title: `Data Pemesanan Kos - ${currentDateTime}`,
                exportOptions: {
                  columns: ':not(.no-export)'
                },
                orientation: 'landscape',
                pageSize: 'A4'
              }
            ],
            responsive: true,
            pageLength: 5,
            language: {
              url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/id.json"
            }
          });
  
          $('#customExportBtnPemesanan').on('click', function () {
            Swal.fire({
              title: 'Pilih Format Ekspor',
              showDenyButton: true,
              showCancelButton: true,
              confirmButtonText: 'Excel',
              denyButtonText: `PDF`,
              cancelButtonText: 'Batal'
            }).then((result) => {
              if (result.isConfirmed) {
                pemesananDataTable.button('.buttons-excel').trigger();
              } else if (result.isDenied) {
                pemesananDataTable.button('.buttons-pdf').trigger();
              }
            });
          });
        },
        error: function (err) {
          console.error("Gagal memuat data pemesanan:", err);
        }
      });
    });

    const currentPage = window.location.pathname.split("/").pop();
    document.querySelectorAll(".sidebar-link").forEach(link => {
      const linkHref = link.getAttribute("href");
      if (linkHref === currentPage) {
        link.classList.add("active");

        const icon = link.querySelector(".icon");
        const originalSrc = icon.getAttribute("src");

        const greenSrc = originalSrc.replace(".svg", "-green.svg");
        icon.setAttribute("src", greenSrc);
      }
    });

        $('#sidebarToggle').click(function() {
      $('.sidebar').toggleClass('show');
    $('#closeSidebarBtn').click(function() {
      $('.sidebar').removeClass('show');
    });

    $('.sidebar-link').click(function() {
    if (window.innerWidth <= 768) {
      $('.sidebar').removeClass('show');
      }
    });
});

  </script>
</body>
</html>
