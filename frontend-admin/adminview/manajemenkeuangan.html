<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manajemen Keuangan | SenangKos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/adminstyle.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css" />
  <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.dataTables.min.css" />
</head>
<body>
  <div class="sidebar">
    <div class="logo-container">
      <img src="../images/logosenangkos.svg" alt="Logo" class="logo">
    </div>
    <ul class="sidebar-menu">
      <li>
        <a href="indexadmin.html" class="sidebar-link">
          <img src="../images/icon-home.svg" class="icon">
          <span class="sidebar-text">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="manajemenkamar.html" class="sidebar-link">
          <img src="../images/icon-mkamar.svg" class="icon">
          <span class="sidebar-text">Manajemen Kamar</span>
        </a>
      </li>
      <li>
        <a href="manajemenkeuangan.html" class="sidebar-link">
          <img src="../images/icon-mkeuangan.svg" class="icon">
          <span class="sidebar-text">Manajemen Keuangan</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="content-wrapper">
    <header>
      <div class="header-buttons-row">
        <div class="header-buttons">
          <button class="btn-green" onclick="window.location.href='../../frontend-user/html/homepage.html'">Lihat Web</button>
          <button class="btn-red" id="logoutBtn">Logout</button>
        </div>
      </div>
      <div class="greeting">
        <h2>Manajemen Keuangan</h2>
        <p>Lihat dan kelola transaksi keuangan kos Anda</p>
      </div>
    </header>

    <div class="main-content">
      <section class="summary">
        <div class="summary-header">
          <h3>Daftar Transaksi</h3>
          <div class="table-actions-left">
            <button class="btn-green" id="customExportBtn">Ekspor</button>
          </div>
        </div>
        <div class="room-table-wrapper">
          <table id="table-transaksi">
            <thead>
              <tr>
                <th>No. Pembayaran</th>
                <th>Order Id</th>
                <th>Metode Pembayaran</th>
                <th>Jumlah Bayar</th>
                <th>Status</th>
                <th>Nama Penghuni</th>
                <th>No. Pemesanan</th>
                <th>Tanggal Pembayaran</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="tabel-transaksi">
              <!-- Data akan dimuat via JavaScript -->
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>


  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
  <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script>
$(document).ready(function () {
  // Logout button
  $('#logoutBtn').click(function () {
    Swal.fire({
      title: 'Konfirmasi',
      text: "Anda yakin ingin logout?",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#3085d6',
      cancelButtonColor: '#d33',
      confirmButtonText: 'Ya, logout!'
    }).then((result) => {
      if (result.isConfirmed) {
        localStorage.removeItem("token");
        Swal.fire({
          title: 'Berhasil!',
          text: 'Anda telah logout.',
          icon: 'success',
          timer: 1500,
          showConfirmButton: false
        }).then(() => {
          window.location.href = '../../frontend-user/html/login.html';
        });
      }
    });
  });

  // Load data dari API
  $.ajax({
    url: "http://localhost:8000/api/pembayarans",
    method: "GET",
    success: function (data) {
      const tableBody = $("#tabel-transaksi");
      let rows = '';

      data.forEach((item, index) => {
        let badge = '';
            console.log('STATUS:', item.status);
            console.log('ITEM:', item);
            if (item.status === 'sukses') {
              badge = '<span class="badge badge-green">Sukses</span>';
            } else if (item.status === 'gagal') {
              badge = '<span class="badge badge-red">Gagal</span>';
            } else if (item.status === 'proses') {
              badge = '<span class="badge badge-yellow">Pending</span>';
            } else if (item.status === 'menunggu pembayaran') {
              badge = '<span class="badge badge-blue">Menunggu Pembayaran</span>';
            }

        rows += `
          <tr>
            <td>${item.id}</td>
            <td>${item.order_id || '-'}</td>
            <td>${item.metode_pembayaran || '-'}</td>
            <td>Rp${Number(item.total_tagihan).toLocaleString('id-ID')}</td>
            <td data-label="Status">${badge}</td>
            <td>${item.penyewa?.name ?? '-'}</td>
            <td>${item.pemesanan_id ?? '-'}</td>
            <td>${new Date(item.created_at).toLocaleDateString('id-ID')}</td>
            <td class="no-export">
              <a href="manajemenkeuangan-update.html?id=${item.id}" button class="btn-action edit" data-id="${item.id}">Edit</a>
            </td>
          </tr>
        `;
      });

    tableBody.html(rows);

      const currentDateTime = new Date().toLocaleString('id-ID', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      dataTable = $("#table-transaksi").DataTable({
      dom: 'lfrtip',
      buttons: [
        {
          extend: 'excelHtml5',
          title: `Data Transaksi Kos - ${currentDateTime}`,
          className: 'd-none',
          exportOptions: {
            columns: ':not(.no-export)'
          }
        },
        {
          extend: 'pdfHtml5',
          title: `Data Transaksi Kos - ${currentDateTime}`,
          className: 'd-none',
          exportOptions: {
            columns: ':not(.no-export)'
          },
          orientation: 'landscape',
          pageSize: 'A4'
        }
      ]
    });
  },
    error: function (xhr, status, error) {
      console.error("Gagal memuat data pembayaran:", error);
    },
  });

  

$('#customExportBtn').on('click', function () {
  Swal.fire({
    title: 'Pilih Format Ekspor',
    showDenyButton: true,
    showCancelButton: true,
    confirmButtonText: 'Excel',
    denyButtonText: `PDF`,
    cancelButtonText: 'Batal'
  }).then((result) => {
    if (result.isConfirmed) {
      dataTable.button('.buttons-excel').trigger();
    } else if (result.isDenied) {
      dataTable.button('.buttons-pdf').trigger();
    }
  });
});

    // Saat klik tombol edit
    $(document).on("click", ".btn-edit", function () {
        const id = $(this).data("id");
        const status = $(this).data("status");
        const metode = $(this).data("metode");

        $("#edit-id").val(id);
        $("#edit-status").val(status);
        $("#edit-metode").val(metode);
        $("#form-edit").show(); // Atau pakai modal
    });

    // Kirim PUT (update)
    $("#btn-update").click(function () {
        const id = $("#edit-id").val();
        const status = $("#edit-status").val();
        const metode = $("#edit-metode").val();

        $.ajax({
            url: `${apiUrl}/${id}`,
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify({
                status: status,
                metode_pembayaran: metode
            }),
            success: function () {
                alert("Data berhasil diperbarui.");
                $("#form-edit").hide();
                loadPembayarans();
            },
            error: function (xhr) {
                console.error(xhr.responseText);
                alert("Gagal memperbarui data.");
            }
        });
      });

      const currentPage = window.location.pathname.split("/").pop();
      document.querySelectorAll(".sidebar-link").forEach(link => {
        const linkHref = link.getAttribute("href");
        if (linkHref === currentPage) {
          link.classList.add("active");

          const icon = link.querySelector(".icon");
          const originalSrc = icon.getAttribute("src");

          const greenSrc = originalSrc.replace(".svg", "-green.svg");
          icon.setAttribute("src", greenSrc);
      }
    });
  });

</script>
</body>
</html>
