<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard | SenangKos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/adminstyle.css" />
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
</head>
<body>
  <div class="sidebar">
    <div class="logo-container">
      <img src="../images/logosenangkos.svg" alt="Logo" class="logo">
    </div>
    <ul class="sidebar-menu">
      <li>
        <a href="indexadmin.html" class="sidebar-link">
          <img src="../images/icon-home.svg" class="icon">
          <span class="sidebar-text">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="manajemenkamar.html" class="sidebar-link">
          <img src="../images/icon-mkamar.svg" class="icon">
          <span class="sidebar-text">Manajemen Kamar</span>
        </a>
      </li>
      <li>
        <a href="manajemenkeuangan.html" class="sidebar-link">
          <img src="../images/icon-mkeuangan.svg" class="icon">
          <span class="sidebar-text">Manajemen Keuangan</span>
        </a>
      </li>
    </ul>
  </div>

  <div class="content-wrapper">
    <header>
      <div class="header-buttons-row">
        <div class="header-buttons">
          <button class="btn-yellow" onclick="window.location.href='editpasswordadmin.html'">Edit Password</button>
          <button class="btn-green" onclick="window.location.href='../../frontend-user/html/homepage.html'">Lihat Web</button>
          <button class="btn-red" id="logoutBtn">Logout</button>
        </div>
      </div>
      <div class="greeting">
        <h2>Halo Ibu Senang!</h2>
        <p>Apa yang bisa kami bantu pada hari ini?</p>
      </div>
    </header>

    <div class="main-content">
      <section class="summary">
        <h3>Ringkasan Data Penyewaan</h3>
        <div class="summary-cards">
          <div class="card"><p>Total Kamar</p><h2 id="total-kamar">0</h2></div>
          <div class="card"><p>Kamar Kosong</p><h2 id="kamar-kosong">0</h2></div>
          <div class="card"><p>Pendapatan Bulan Ini</p><h2 id="pendapatan">Rp0</h2></div>
        </div>
      </section>

      <section class="penyewa">
        <h3>Data Penghuni</h3>
        <table id="tabel-penyewa" class="display">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nama</th>
              <th>Username</th>
              <th>Nomor HP</th>
              <th>Alamat Email</th>
            </tr>
          </thead>
          <tbody id="penyewa-table-body">
            <!-- Diisi dengan AJAX -->
          </tbody>
        </table>
      </section>
    </div>
  </div>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

  <script>
    $(document).ready(function () {
      const token = localStorage.getItem("token");
      if (!token) {
        Swal.fire({
          icon: 'error',
          title: 'Gagal!',
          text: 'Anda harus login terlebih dahulu.',
          allowOutsideClick: false,
          allowEscapeKey: false
        }).then(() => {
          window.location.href = '../../frontend-user/html/login.html';
        });
        return; // Stop semua eksekusi script
      }
      loadRingkasanData(); // <--- Tambahkan ini
      $('#logoutBtn').click(function () {
        Swal.fire({
          title: 'Konfirmasi',
          text: "Anda yakin ingin logout?",
          icon: 'warning',
          showCancelButton: true,
          confirmButtonColor: '#3085d6',
          cancelButtonColor: '#d33',
          confirmButtonText: 'Ya, logout!'
        }).then((result) => {
          if (result.isConfirmed) {
            localStorage.removeItem("token"); // Hapus token login
            Swal.fire({
              title: 'Berhasil!',
              text: 'Anda telah logout.',
              icon: 'success',
              timer: 1500,
              showConfirmButton: false
            }).then(() => {
              window.location.href = '../../frontend-user/html/login.html'; // Arahkan ke halaman login
            });
          }
        });
      });
    });
  
      function loadRingkasanData() {
      $.ajax({
        url: 'http://localhost:8000/api/kamars', // Ganti dengan endpoint yang sesuai untuk kamar
        method: 'GET',
        success: function (res) {
          let totalKamar = res.length; // Hitung total kamar
          let kamarKosong = res.filter(kamar => kamar.status === 'Kosong').length; // Hitung kamar kosong
          let pendapatan = res.reduce((total, kamar) => {
            // Asumsikan 'pendapatan' adalah nilai yang ada di tiap data kamar
            return total + (kamar.status === 'terisi' ? kamar.harga : 0);
          }, 0);

          // Update elemen HTML dengan hasil perhitungan
          $('#total-kamar').text(totalKamar);
          $('#kamar-kosong').text(kamarKosong);
          $('#pendapatan').text('Rp' + pendapatan.toLocaleString());
        },
        error: function (err) {
          console.error("Gagal memuat data kamar:", err);
        }
      });
    }

    // Ambil data pembayaran untuk hitung pendapatan bulan ini
    const token = localStorage.getItem("token");

    if (!token) {
      console.error("Token tidak ditemukan. Pengguna belum login.");
      Swal.fire({
        icon: 'error',
        title: 'Gagal!',
        text: 'Anda harus login terlebih dahulu.',
      });
    } else {
      $.ajax({
        url: 'http://localhost:8000/api/pembayarans',
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`
        },
        success: function (res) {
          const today = new Date();
          const currentMonth = today.getMonth(); // bulan saat ini (0-11)
          const currentYear = today.getFullYear();

          let totalPendapatan = 0;

          res.forEach(item => {
            const status = (item.status || '').trim().toLowerCase();
            const tanggal = new Date(item.created_at);

            if (
              status === 'sukses' &&
              tanggal.getMonth() === currentMonth &&
              tanggal.getFullYear() === currentYear
            ) {
              const tagihan = parseFloat(item.total_tagihan);
              if (!isNaN(tagihan)) {
                totalPendapatan += tagihan;
              }
            }
          });

          $('#pendapatan').text('Rp' + totalPendapatan.toLocaleString('id-ID'));
        },
        error: function (err) {
          console.error("Gagal memuat data pembayaran:", err);
          Swal.fire({
            icon: 'error',
            title: 'Error!',
            text: 'Gagal memuat data pembayaran dari server.',
          });
        }
      });
    }
      
      // Load data penyewa
      $.ajax({
        url: 'http://localhost:8000/api/users?role=penyewa',
        method: 'GET',
        success: function (res) {
          const tbody = $('#penyewa-table-body');
          tbody.empty();

          res.forEach(user => {
            const row = `
              <tr>
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td>${user.username ?? '-'}</td>
                <td>${user.no_telp ?? '-'}</td>
                <td>${user.email ?? '-'}</td>
              </tr>`;
            tbody.append(row);
          });

          // Aktifkan DataTables setelah data dimuat
          $('#tabel-penyewa').DataTable({
            responsive: true,
            pageLength: 5,
            language: {
              url: "//cdn.datatables.net/plug-ins/1.13.6/i18n/id.json"
            }
          });
        },
        error: function (err) {
          console.error("Gagal memuat data penyewa:", err);
        }
      });

      const currentPage = window.location.pathname.split("/").pop();
    document.querySelectorAll(".sidebar-link").forEach(link => {
      const linkHref = link.getAttribute("href");
      if (linkHref === currentPage) {
        link.classList.add("active");

        const icon = link.querySelector(".icon");
        const originalSrc = icon.getAttribute("src");

        const greenSrc = originalSrc.replace(".svg", "-green.svg");
        icon.setAttribute("src", greenSrc);
      }
    });
    
  </script>
</body>
</html>
