<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Info Kamar</title>
  <link rel="stylesheet" href="../css/kamaruser.css" />
</head>
<body>
  <section class="container">
    <header>
      <span class="back" onclick="goBack()" title="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </span>
      <h2>Kamar Anda</h2>
    </header>

    <div class="card">
      <img src="../images/Kamar.png" alt="Foto Kamar" class="card-img">
      <div class="detail-kamar">
          <h3 class="title">Kamar Anda</h3> <!-- Judul kamar, bisa disesuaikan -->
          <p class="description">
              <strong>Kamar Anda hadir dengan fasilitas modern dan telah dilengkapi tempat tidur nyaman berukuran 6 m², siap menunjang kenyamanan Anda.</strong>
          </p>
          <p class="status">Status: <strong>Aktif (Disewa)</strong></p>
          <p class="tanggal-masuk">Tanggal Masuk: <strong>01 Januari 2025</strong></p> <!-- Tambahkan tanggal masuk -->
      </div>
  </div>
  

    <h3 class="subtitle">History Pembayaran</h3>
    <div class="history-card" id="history-pembayaran">
      <!-- Data dari jQuery akan masuk di sini -->
      
    </div>
  </section>
  <button class="btn-bayar"  id="btn-bayar">Bayar Lagi</button>

  <!-- jQuery & SweetAlert -->
  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>
  <script>
    function goBack() {
      window.location.href = "homeuser.html"; // Ganti sesuai kebutuhan
    }
  
    $(document).ready(function () {
      const token = localStorage.getItem("token");
  
      if (!token) {
        Swal.fire({
          icon: 'warning',
          title: 'Token Tidak Ditemukan',
          text: 'Silakan login terlebih dahulu.'
        }).then(() => {
          window.location.href = 'login.html';
        });
        return;
      }
  
      $.ajax({
        url: 'http://localhost:8000/api/pembayarans',
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token
        },
        success: function (response) {
          let html = '';
  
          if (!response || response.length === 0) {
            html = `<p>Tidak ada riwayat pembayaran.</p>`;
          } else {
            response.forEach(function (item) {
              html += `
                <div class="history-item">
                  <div class="check">✅</div>
                  <div class="tanggal">${formatTanggal(item.updated_at)}</div>
                  <div class="jumlah">Rp${formatRupiah(item.total_tagihan)}</div>
                  <div class="status">${item.status}</div>
                </div>
              `;
            });
          }
  
          $("#history-pembayaran").html(html);
        },
        error: function (xhr) {
          console.error('Error response:', xhr);
          Swal.fire({
            icon: 'error',
            title: 'Gagal Mengambil Data',
            text: xhr.responseJSON?.message || 'Terjadi kesalahan saat mengambil data.'
          });
        }
      });
  
      function formatTanggal(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      }
  
      function formatRupiah(angka) {
        const num = parseInt(angka);
        return isNaN(num) ? '0' : num.toLocaleString('id-ID');
      }
    });
  </script>
  
  
  <script>
     $(document).ready(function () {
      $('#btn-bayar').on('click', function (e) {
        e.preventDefault();
  
        const token = localStorage.getItem('token');
        const penyewa_id = localStorage.getItem('penyewa_id');
        const total_tagihan = 600000;
  
        if (!token || !penyewa_id) {
          Swal.fire('Gagal', 'Data tidak lengkap.', 'error');
          return;
        }
  
        $.ajax({
          url: 'http://localhost:8000/api/pembayarans',
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token
          },
          data: {
            penyewa_id,
            total_tagihan,
            metode_pembayaran: 'bank_transfer', // Ubah ke bank_transfer
            payment_method: 'bank_transfer',
            bank: 'bni' // Ganti ke 'bca', 'mandiri', atau 'permata' jika perlu
          },
          success: function (res) {
            if (res.payment_url) {
              window.location.href = res.payment_url;
            } else {
              Swal.fire('Berhasil', 'Silakan cek VA di dashboard atau email.', 'success');
              // Bisa tampilkan info pembayaran juga di modal kalau mau
            }
          },
          error: function (xhr) {
            console.error(xhr.responseText);
            Swal.fire('Gagal', 'Gagal membuat pembayaran.', 'error');
          }
        });
      });
    });
  </script>

  <script>
  $(document).ready(function () {
    let token = localStorage.getItem('token');

    try {
      const parsedToken = JSON.parse(token);
      if (parsedToken.token) token = parsedToken.token;
    } catch (e) {}

    if (!token) {
      Swal.fire('Token Hilang', 'Silakan login ulang.', 'error');
      return;
    }

    // Ambil user info dari token (pastikan API-nya ada dan valid)
    $.ajax({
      url: 'http://localhost:8000/api/user', // asumsi ini endpoint info user
      method: 'GET',
      headers: {
        Authorization: 'Bearer ' + token
      },
      success: function (user) {
        const penyewaId = user.id;

        // Setelah dapat penyewa_id, ambil data pemesanan
        $.ajax({
          url: 'http://localhost:8000/api/pemesanans',
          method: 'GET',
          headers: {
            Authorization: 'Bearer ' + token
          },
          success: function (res) {
            if (Array.isArray(res)) {
              const dataPenyewa = res.find(p => p.penyewa_id === penyewaId);

              if (dataPenyewa) {
                if (dataPenyewa.nama_kamar) {
                  $('.detail-kamar h3').text(dataPenyewa.nama_kamar);
                }

                if (dataPenyewa.tgl_masuk) {
                  const tanggal = new Date(dataPenyewa.tgl_masuk);
                  const options = { day: 'numeric', month: 'long', year: 'numeric' };
                  const formatted = tanggal.toLocaleDateString('id-ID', options);
                  $('.detail-kamar p:contains("Tanggal Masuk") strong').text(formatted);
                }
              } else {
                console.warn('Tidak ada pemesanan untuk penyewa ini');
              }
            }
          },
          error: function (xhr) {
            console.error('Gagal ambil pemesanan:', xhr.responseText);
          }
        });
      },
      error: function (xhr) {
        console.error('Gagal ambil user dari token:', xhr.responseText);
        Swal.fire('Gagal Ambil Data', 'Silakan login ulang.', 'error');
      }
    });
  });
</script>

</body>
</html>
