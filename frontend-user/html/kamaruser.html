<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Info Kamar</title>
  <link rel="stylesheet" href="../css/kamaruser.css" />
</head>
<body>
  <section class="container">
    <header>
      <span class="back" onclick="goBack()" title="Kembali">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </span>
      <h2>Kamar Anda</h2>
    </header>

    <div class="card">
      <img src="../images/kamar.jpg" alt="Foto Kamar">
      <div class="info">
        <h3>Kamar No 1</h3>
        <p>Luas kamar <strong>6 m²</strong></p>
        <p>Status <strong>Aktif (Disewa)</strong></p>
        <p>Tanggal Masuk <strong>25 April 2025</strong></p>
      </div>
    </div>

    <h3 class="subtitle">History Pembayaran</h3>
    <div class="history-card" id="history-pembayaran">
      <!-- Data dari jQuery akan masuk di sini -->
      <button class="btn-bayar">Bayar Lagi</button>
    </div>
  </section>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    function goBack() {
      window.location.href = "homeuser.html"; // Ganti sesuai kebutuhan
    }

    $(document).ready(function () {
      const token = localStorage.getItem("token");

      if (!token) {
        Swal.fire({
          icon: 'warning',
          title: 'Token Tidak Ditemukan',
          text: 'Silakan login terlebih dahulu.'
        }).then(() => {
          window.location.href = 'login.html';
        });
        return;
      }

      $.ajax({
        url: 'http://localhost:8000/api/pembayarans',
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token
        },
        success: function (response) {
          let html = '';

          if (response.length === 0) {
            html = `<p>Tidak ada riwayat pembayaran.</p>`;
          } else {
            response.forEach(function (item) {
              html += `
                <div class="history-item">
                  <div class="check">✅</div>
                  <div class="tanggal">${formatTanggal(item.updated_at)}</div>
                  <div class="jumlah">Rp${formatRupiah(item.total_tagihan)}</div>
                  <div class="status">${item.status}</div>
                </div>
              `;
            });
          }

          $("#history-pembayaran").prepend(html);
        },
        error: function (xhr) {
          Swal.fire({
            icon: 'error',
            title: 'Gagal Mengambil Data',
            text: xhr.responseJSON?.message || 'Terjadi kesalahan saat mengambil data.'
          });
        }
      });

      function formatTanggal(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('id-ID', {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        });
      }

      function formatRupiah(angka) {
        return parseInt(angka).toLocaleString('id-ID');
      }
    });
  </script>
</body>
</html>
