<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Password</title>
  <link rel="stylesheet" href="../css/lupa-password.css" />
</head>
<body>
  <a href="login.html" class="back-button">&lt;</a>

  <div class="container">
    <h1>Lupa Password</h1>
    <form class="form-box" id="password-form">
      <label for="new-password">Password Baru</label>
      <input type="password" id="new-password" placeholder="Masukkan password baru" required>

      <label for="confirm-password">Konfirmasi Password</label>
      <input type="password" id="confirm-password" placeholder="Konfirmasi password baru" required>

      <button type="submit" class="save-button">Simpan Password</button>
    </form>
  </div>

    <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>

  <script>
  function getQueryParam(param) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(param);
  }

  $(document).ready(function() {
    const token = getQueryParam('token');
    const email = getQueryParam('email');

    if (!token || !email) {
      alert("Link reset tidak valid.");
      window.location.href = "login.html";
      return;
    }

    $('#password-form').on('submit', function(e) {
      e.preventDefault();

      const password = $('#new-password').val().trim();
      const confirmPassword = $('#confirm-password').val().trim();

      if (password === "" || confirmPassword === "") {
        alert("Semua kolom wajib diisi.");
        return;
      }

      if (password !== confirmPassword) {
        alert("Password dan konfirmasi tidak cocok.");
        return;
      }

      $.ajax({
        url: 'http://localhost:8000/api/reset-password',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
          email: email,
          token: token,
          password: password,
          password_confirmation: confirmPassword
        }),
        success: function(response) {
          alert("Password berhasil diubah. Silakan login.");
          window.location.href = "login.html";
        },
        error: function(xhr) {
          let msg = "Terjadi kesalahan. Silakan coba lagi.";
          if (xhr.responseJSON && xhr.responseJSON.message) {
            msg = xhr.responseJSON.message;
          }
          alert(msg);
        }
      });
    });
  });
</script>
 
</body>
</html>
