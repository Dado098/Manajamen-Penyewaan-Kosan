<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>

  <div class="logo-wrapper">
    <img src="../images/lg.svg" alt="Logo Senangkos" />
  </div> 
  <div class="login">
    <div class="container">
      
      
  
      <!-- Form Login -->
      <div class="popup-login">
        <a href="index.html" class="back-button">&lt;</a>
        <div class="login-sekarang-juga">Login Sekarang Juga!</div>
  
        <div class="form-group">
          <input type="text" id="username" class="input-field" placeholder="Username" />
        </div>
  
        <div class="form-group">
          <input type="password" id="password" class="input-field" placeholder="Password" />
        </div>
        <p class="forgot-password">
          <a href="lupa-password.html" class="forgot-password-link">Lupa Password?</a>
        </p>
        
        <p class="signup-link">
          Belum memiliki akun? <a href="register.html"><strong>Daftar di sini</strong></a>
        </p>
        
        <div class="login-btn" id="login-btn">Login</div>
        
        <p id="error-message" class="hidden error-message"></p>
        

  
        <p id="error-message" class="hidden error-message"></p>
      </div>
  
    </div>
  </div>
  
  <script src="../js/login.js"></script>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>

  <script>
    $(document).ready(function () {
      $("#login-btn").click(function (e) {
        e.preventDefault();
  
        const username = $("#username").val().trim();
        const password = $("#password").val().trim();
  
        $("#error-message").addClass('hidden').text('');
  
        if (!username || !password) {
          $("#error-message").removeClass('hidden').text('Username dan Password wajib diisi.');
          return;
        }
  
        $.ajax({
          url: "http://localhost:8000/api/login",
          method: "POST",
          data: {
            username: username,
            password: password
          },
          success: function (response) {
            // Simpan token dan data user ke localStorage
            localStorage.setItem("token", response.access_token);
            localStorage.setItem("penyewa_id", response.penyewa_id || '');
            localStorage.setItem("role", response.role || '');
            localStorage.setItem("email_verified_at", response.email_verified_at || '');
  
            if (response.role === "pemilik") {
              window.location.href = "../../frontend-admin/adminview/indexadmin.html";
            } else if (response.role === "penyewa") {
              if (!response.email_verified_at) {
                $("#error-message").removeClass('hidden').text("Email harus diverifikasi terlebih dahulu. Silakan cek email Anda.");
                return;
              }
              window.location.href = "homepage.html";
            } else {
              $("#error-message").removeClass('hidden').text("Role tidak dikenali.");
            }
          },
          error: function (xhr) {
            let errorMsg = "Login gagal. Coba lagi.";
            if (xhr.responseJSON) {
              const res = xhr.responseJSON;
              if (res.errors?.username) {
                errorMsg = res.errors.username[0];
              } else if (res.errors?.password) {
                errorMsg = res.errors.password[0];
              } else if (res.errors?.email) {
                errorMsg = res.errors.email[0];
              } else if (res.message) {
                errorMsg = res.message;
              }
            }
  
            $("#error-message").removeClass('hidden').text(errorMsg);
          }
        });
      });
    });
  </script>
  

</body>
</html>
