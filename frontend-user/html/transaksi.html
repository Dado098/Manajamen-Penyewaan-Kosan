<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transaksi Pembayaran</title>
  <link rel="stylesheet" href="../css/transaksi.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="container">
    <h2>Transaksi Pembayaran</h2>

    <div class="box-info">
      <p>Silakan selesaikan pembayaran Anda</p>
      <i class="fas fa-hourglass-half jam-ikon"></i>
      <p class="menunggu">Menunggu Pembayaran</p>
      <p class="batas-waktu">Bayar sebelum: <strong>12 April 2025</strong></p>
    </div>

    <form id="formBukti">
      <label for="buktiPembayaran">Upload Bukti Pembayaran:</label>
      <input type="file" id="buktiPembayaran" required>
      
      <button type="submit">Kirim</button>
    </form>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/transaksi.js"></script>
</body>
</html>
