  <title>Halaman Pembayaran</title>
  <link rel="stylesheet" href="../css/halamanpembayaran.css" /> 
</head>
<body>
  <div class="container">
    <h2>Halaman Pembayaran</h2>

    <div class="room-details">
      <img src="../images/kamar1.png" alt="Gambar Kamar" class="room-image" />
      <div class="room-info">
        <div class="room-detail">
          <p><strong>Luas Kamar:</strong> 25 m²</p>
        </div>
        <div class="room-detail">
          <p><strong>Deskripsi:</strong> Kamar nyaman, dilengkapi dengan AC dan tempat tidur besar.</p>
        </div>
        <div class="room-detail">
          <p><strong>Total Pembayaran:</strong> <span class="price">Rp 600.000</span></p>
        </div>
      </div>
    </div>

    <form id="formPembayaran">

      <div class="button-group">
        <a href="explorekmr.html" class="cancel-btn">Cancel</a>
        <button type="button" class="pay-button" id="btn-bayar">Booking Sekarang</button>
      </div>
    </form>
  </div>

  <!-- jQuery & SweetAlert -->
  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>
  

  <script>
    $(document).ready(function () {
      $('#btn-bayar').on('click', function (e) {
        e.preventDefault();
  
        const token = localStorage.getItem('token');
        const pemesanan_id = localStorage.getItem('pemesanan_id');
        const penyewa_id = localStorage.getItem('penyewa_id');
        const total_tagihan = 600000;
  
        if (!token || !pemesanan_id || !penyewa_id) {
          Swal.fire('Gagal', 'Data tidak lengkap.', 'error');
          return;
        }
  
        $.ajax({
          url: 'http://localhost:8000/api/pembayarans',
          method: 'POST',
          headers: {
            Authorization: 'Bearer ' + token
          },
          data: {
            pemesanan_id,
            penyewa_id,
            total_tagihan,
            metode_pembayaran: 'bank_transfer', // Ubah ke bank_transfer
            payment_method: 'bank_transfer',
            bank: 'bni' // Ganti ke 'bca', 'mandiri', atau 'permata' jika perlu
          },
          success: function (res) {
            if (res.payment_url) {
              window.location.href = res.payment_url;
            } else {
              Swal.fire('Berhasil', 'Silakan cek VA di dashboard atau email.', 'success');
              // Bisa tampilkan info pembayaran juga di modal kalau mau
            }
          },
          error: function (xhr) {
            console.error(xhr.responseText);
            Swal.fire('Gagal', 'Gagal membuat pembayaran.', 'error');
          }
        });
      });
    });
  </script>
  

  <!-- <script src="halamanpembayaran.js"></script> -->
  
  
  

  
</body>
</html>
