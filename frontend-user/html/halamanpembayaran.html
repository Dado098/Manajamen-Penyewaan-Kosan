<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Halaman Pembayaran</title>
  <link rel="stylesheet" href="../css/halamanpembayaran.css" />

  <!-- Midtrans Snap -->
  <script type="text/javascript"
    src="https://app.sandbox.midtrans.com/snap/snap.js"
    data-client-key="SB-Mid-client-huB6drUtGM6XMmZ6"></script>
</head>
<body>
  <div class="container">
    <h2>Halaman Pembayaran</h2>

    <div class="room-details">
      <img src="../images/kamar1.png" alt="Gambar Kamar" class="room-image" />
      <div class="room-info">
        <div class="room-detail">
          <p><strong>Luas Kamar:</strong> 25 m²</p>
        </div>
        <div class="room-detail">
          <p><strong>Deskripsi:</strong> Kamar nyaman, dilengkapi dengan AC dan tempat tidur besar.</p>
        </div>
        <div class="room-detail">
          <p><strong>Total Pembayaran:</strong> <span class="price">Rp 600.000</span></p>
        </div>
      </div>
    </div>

    <form id="formPembayaran">
      <label>Nama Pemesan:</label>
      <input type="text" name="nama" required />

      <label>Metode Pembayaran:</label>
      <select name="payment_method" required>
        <option value="virtual_account">Virtual Account</option>
        <option value="qr_code">QR Code</option>
      </select>

      <label>Pilih Bank:</label>
      <select name="bank" required>
        <option value="bni">BNI</option>
        <option value="bri">BRI</option>
        <option value="cimb">CIMB</option>
        <option value="mandiri">Mandiri</option>
        <option value="permata">Permata</option>
      </select>

      <div class="button-group">
        <a href="explorekmr.html" class="cancel-btn">Cancel</a>
        <button type="submit" class="pay-button">Booking Sekarang</button>
      </div>
    </form>
  </div>

  <!-- jQuery & SweetAlert -->
  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="YOUR_CLIENT_KEY"></script>

  <script>
   $('#btnBooking').on('click', function (e) {
  e.preventDefault();

  const tglMasuk = $('#tgl_masuk').val();
  const tglKeluar = $('#tgl_keluar').val();
  const kamarId = $('#kamar_id').val();
  const token = localStorage.getItem('token');

  if (!token) {
    Swal.fire({
      icon: 'error',
      title: 'Tidak Login',
      text: 'Silakan login terlebih dahulu.'
    });
    return;
  }

  if (!tglMasuk || !tglKeluar || !kamarId) {
    Swal.fire({
      icon: 'error',
      title: 'Form Tidak Lengkap',
      text: 'Pastikan semua field terisi.'
    });
    return;
  }

  if (new Date(tglKeluar) <= new Date(tglMasuk)) {
    Swal.fire({
      icon: 'error',
      title: 'Tanggal Tidak Valid',
      text: 'Tanggal keluar harus setelah tanggal masuk.'
    });
    return;
  }

  // Step 1: Booking dulu
  $.ajax({
    url: 'http://localhost:8000/api/pemesanans',
    method: 'POST',
    headers: {
      Authorization: 'Bearer ' + token
    },
    data: {
      tgl_masuk: tglMasuk,
      tgl_keluar: tglKeluar,
      kamar_id: kamarId
    },
    success: function (bookingResponse) {
      const pemesananId = bookingResponse.id;
      const penyewaId = bookingResponse.penyewa_id;
      const totalTagihan = bookingResponse.total_tagihan; // pastikan API booking mengembalikan ini
      const bank = $('#bank').val(); // misalnya kamu punya dropdown untuk pilih bank

      // Step 2: Buat pembayaran
      $.ajax({
        url: 'http://localhost:8000/api/pembayarans',
        method: 'POST',
        headers: {
          Authorization: 'Bearer ' + token
        },
        data: {
          pemesanan_id: pemesananId,
          penyewa_id: penyewaId,
          total_tagihan: totalTagihan,
          bank: bank
        },
        success: function (paymentResponse) {
          const paymentUrl = paymentResponse.payment_url;
          Swal.fire({
            icon: 'success',
            title: 'Booking Berhasil!',
            text: 'Mengalihkan ke halaman pembayaran...'
          }).then(() => {
            window.location.href = paymentUrl; // ⬅ ini redirect ke halaman Midtrans
          });
        },
        error: function (xhr) {
          console.error('Error pembayaran:', xhr.responseText);
          Swal.fire({
            icon: 'error',
            title: 'Gagal Buat Pembayaran',
            text: 'Terjadi kesalahan saat membuat pembayaran.'
          });
        }
      });
    },
    error: function (xhr) {
      console.error('Error booking:', xhr.responseText);
      Swal.fire({
        icon: 'error',
        title: 'Gagal Booking',
        text: 'Terjadi kesalahan saat booking.'
      });
    }
  });
});

  </script>
</body>
</html>
