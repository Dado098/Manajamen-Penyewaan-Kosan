<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil Senangkos</title>
  <link rel="stylesheet" href="../css/profile.css" />
</head>
<body>
  <div class="profil">
    <div class="profil-container">
      <!-- Gambar Profil -->
      <img src="../images/ph.jpg" alt="Profil" />

      <!-- Nama -->
      <h1 id="profile-name">Indira Sistamarien</h1>

      <!-- Data Diri -->
      <div class="data-diri">
        <div class="data-row">
          <div class="data-label">Nama</div>
          <div class="data-value" id="profile-nama">Indira Sistamarien</div>
        </div>
        <div class="data-row">
          <div class="data-label">Email</div>
          <div class="data-value" id="profile-email">asikinbosss@gmail.com</div>
        </div>
        <div class="data-row">
          <div class="data-label">Nomor HP</div>
          <div class="data-value" id="profile-hp">0878-3214-8897</div>
        </div>
      </div>
      
      <!-- Tombol -->
      <div class="button-group">
        <a href="editprofile.html"><button class="btn-edit">Edit Profil</button></a>
        <button class="btn-logout">Keluar</button>
      </div>
    </div>
  </div>
  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>

  <script>
    $(document).ready(function () {
      // Ambil token dari localStorage
      const token = localStorage.getItem('token'); // pastikan saat login kamu simpan token ke localStorage
  
      if (!token) {
        Swal.fire({
          icon: 'error',
          title: 'Token Hilang',
          text: 'Silakan login kembali.'
        }).then(() => {
          window.location.href = "login.html"; // Arahkan ke login page
        });
        return;
      }
  
      // Panggil API user yang sedang login
      $.ajax({
        url: '/api/user', // biasanya endpoint ambil user login
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token
        },
        dataType: 'json',
        success: function(user) {
          // Tampilkan data user ke halaman profil
          $("#profile-name").text(user.nama);
          $("#profile-nama").text(user.nama);
          $("#profile-email").text(user.email);
          $("#profile-hp").text(user.hp);
  
          // Simpan juga ke localStorage kalau mau
          localStorage.setItem("userProfile", JSON.stringify(user));
        },
        error: function(xhr, status, error) {
          console.error("Gagal ambil data user:", error);
          Swal.fire({
            icon: 'error',
            title: 'Session Expired',
            text: 'Sesi anda habis, silahkan login ulang.'
          }).then(() => {
            localStorage.removeItem("token");
            window.location.href = "login.html";
          });
        }
      });
  
      // Handle logout
      $(".btn-logout").on('click', function () {
        localStorage.removeItem("userProfile");
        localStorage.removeItem("token");
        window.location.href = "homepage.html";
      });
    });
  </script>
