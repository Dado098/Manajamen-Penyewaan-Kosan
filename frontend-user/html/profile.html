<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profil Senangkos</title>
  <link rel="stylesheet" href="../css/profile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="profil">
    <div class="profil-container">
      <!-- Gambar Profil -->
      <img src="../images/ph.jpg" alt="Profil" />

      <!-- Nama -->
      <h1>Indira Sistamarien</h1>

      <!-- Data Diri -->
      <div class="data-diri">
        <div class="data-row">
          <div class="data-label">Nama</div>
          <div class="data-value">Indira Sistamarien</div>
        </div>
        <div class="data-row">
          <div class="data-label">Email</div>
          <div class="data-value">asikinbosss@gmail.com</div>
        </div>
        <div class="data-row">
          <div class="data-label">Nomor HP</div>
          <div class="data-value">0878-3214-8897</div>
        </div>
      </div>
      
      <!-- Tombol -->
      <div class="button-group">
        <button class="btn-edit">Edit Profil</button>
        <button class="btn-delete">Hapus Akun</button>
        <button class="btn-logout">Keluar</button>
      </div>
    </div>
  </div>
</body>
</html>
