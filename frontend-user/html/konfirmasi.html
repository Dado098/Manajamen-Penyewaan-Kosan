<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Konfirmasi Pembayaran</title>
  <link rel="stylesheet" href="../css/konfirmasi.css">
</head>
<body>
  <div class="container">
    <h2>Konfirmasi Pembayaran</h2>

    <!-- Ikon Centang Hijau -->
    <div class="icon-sukses">
      <img src="https://img.icons8.com/ios/50/28a745/checkmark.png" alt="Checkmark">
    </div>

    <!-- Teks Status Pembayaran -->
    <div class="status-pembayaran">
      <p>Pembayaran Berhasil</p>
    </div>
    <div class="status-pembayarann">
        <p>Pembayaran Anda Diterima</p>
      </div>

    <button id="btnKontakPengelola">
      Kontak Pengelola Kostan
    </button>

    <div id="detailKonfirmasi">
      <!-- Informasi dari transaksi akan muncul di sini -->
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../js/konfirmasi.js"></script>
</body>
</html>
