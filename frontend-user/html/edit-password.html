<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Password</title>
  <link rel="stylesheet" href="../css/edit-password.css" />
</head>
<body>
  <a href="editprofile.html" class="back-button">&lt;</a>

  <div class="container">
    <h1>Edit Password</h1>
    <form class="form-box" id="password-form">
      <label for="new-password">Password Baru</label>
      <input type="password" id="new-password" placeholder="Masukkan password baru" required>

      <label for="confirm-password">Konfirmasi Password</label>
      <input type="password" id="confirm-password" placeholder="Konfirmasi password baru" required>

      <button type="submit" class="save-button">Simpan Password</button>
    </form>
  </div>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
  $(document).ready(function () {
    $('#password-form').on('submit', function (e) {
      e.preventDefault();

      const newPassword = $('#new-password').val().trim();
      const confirmPassword = $('#confirm-password').val().trim();
      const token = localStorage.getItem('token');

      if (!newPassword || !confirmPassword) {
        Swal.fire({
          icon: 'warning',
          title: 'Peringatan',
          text: 'Semua kolom wajib diisi.'
        });
        return;
      }

      if (newPassword !== confirmPassword) {
        Swal.fire({
          icon: 'error',
          title: 'Oops...',
          text: 'Password dan konfirmasi tidak cocok.'
        });
        return;
      }

      $.ajax({
        url: 'http://localhost:8000/api/users/update-password',
        method: 'POST',
        headers: {
          Authorization: `Bearer ${token}`
        },
        data: {
          password: newPassword,
          password_confirmation: confirmPassword
        },
        success: function (response) {
          Swal.fire({
            icon: 'success',
            title: 'Berhasil',
            text: 'Password berhasil diperbarui.'
          }).then(() => {
            window.location.href = 'editprofile.html';
          });
        },
        error: function (xhr) {
          let msg = 'Gagal memperbarui password.';
          if (xhr.responseJSON?.message) {
            msg = xhr.responseJSON.message;
          }
          Swal.fire({
            icon: 'error',
            title: 'Gagal',
            text: msg
          });
        }
      });
    });
  });
</script>


</body>
</html>
