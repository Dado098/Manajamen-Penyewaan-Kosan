<!-- Form Login -->
<div class="popup-login">
  <a href="login.html" class="back-button">&lt;</a>
  <div class="login-sekarang-juga">Masukan Email Anda</div>

  <form id="login-form">
    <div class="form-group">
      <input type="text" id="username" class="input-field" placeholder="Email" required />
    </div>

    <button type="submit" class="login-btn" id="login-btn">Simpan Email</button>
  </form>

  <p id="error-message" class="hidden error-message"></p>
</div>
<script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault(); // agar tidak reload halaman

    const email = document.getElementById('username').value.trim();
    const errorMsg = document.getElementById('error-message');

    if (email === "") {
      errorMsg.textContent = "Email wajib diisi!";
      errorMsg.classList.remove('hidden');
    } else {
      errorMsg.classList.add('hidden');
      alert("Email berhasil disimpan: " + email);
      // lakukan aksi simpan atau kirim ke server di sini
    }
  });
</script>

 <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const email = document.getElementById('username').value.trim();
    const errorMsg = document.getElementById('error-message');

    if (email === "") {
      errorMsg.textContent = "Email wajib diisi!";
      errorMsg.classList.remove('hidden');
      return;
    }

    errorMsg.classList.add('hidden');

    fetch('http://localhost:8000/api/forgot-password', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ email: email })
})
.then(async response => {
  const contentType = response.headers.get('content-type') || '';
  let data = null;

  if (contentType.includes('application/json')) {
    data = await response.json();
  } else {
    // Jika bukan JSON, coba ambil textnya
    const text = await response.text();
    throw new Error('Response bukan JSON: ' + text);
  }

  if (!response.ok) {
    const msg = data.message || "Gagal mengirim link reset. Pastikan email sudah terdaftar.";
    throw new Error(msg);
  }

  return data;
})
.then(data => {
  Swal.fire({
    icon: 'success',
    title: 'Berhasil',
    text: data.message || 'Link reset password telah dikirim ke email Anda.',
  });
})
.catch(error => {
  Swal.fire({
    icon: 'error',
    title: 'Gagal',
    text: error.message,
  });
});
  });
</script>
