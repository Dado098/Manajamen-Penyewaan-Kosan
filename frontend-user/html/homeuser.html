  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>
  
  <script>
    $(document).ready(function () {
      const token = localStorage.getItem('token');
  
      // Ambil nama user
      if (token) {
        $.ajax({
          url: 'http://localhost:8000/api/user',
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token
          },
          success: function (user) {
            $('.hero-content h1 span:first').text('Hallo, ' + user.name); // Ganti "Hallo, User" dengan nama asli
          },
          error: function () {
            console.error('Gagal mengambil data pengguna');
          }
        });
      }
  
      // Ambil data kamar
      $.ajax({
        url: 'http://localhost:8000/api/kamars',
        method: 'GET',
        dataType: 'json',
        success: function (data) {
          const kamarTerbatas = data.slice(0, 5);
  
          $('.kamar-list .card').each(function (index) {
            if (index < kamarTerbatas.length) {
              const kamar = kamarTerbatas[index];
              const imageUrl = `http://localhost:8000/storage/${kamar.image}`;
  
              $(this).find('img').attr('src', imageUrl);
              $(this).find('img').attr('alt', `Foto Kamar ${kamar.id}`);
              $(this).find('p2').text('Rp ' + parseInt(kamar.harga).toLocaleString() + ' /bulan');
              $(this).find('p1').text('Kamar ' + kamar.id);
            }
          });
        },
        error: function (xhr, status, error) {
          console.error('Gagal memuat data kamar:', error);
        }
      });
    });
  </script>
  

<script>
  $(document).ready(function () {
    let token = localStorage.getItem('token');

    try {
      const parsedToken = JSON.parse(token);
      if (parsedToken.token) token = parsedToken.token;
    } catch (e) {}

    if (!token) {
      Swal.fire('Token Hilang', 'Silakan login ulang.', 'error');
      return;
    }

    // Ambil user info dari token (pastikan API-nya ada dan valid)
    $.ajax({
      url: 'http://localhost:8000/api/user', // asumsi ini endpoint info user
      method: 'GET',
      headers: {
        Authorization: 'Bearer ' + token
      },
      success: function (user) {
        const penyewaId = user.id;

        // Setelah dapat penyewa_id, ambil data pemesanan
        $.ajax({
          url: 'http://localhost:8000/api/pemesanans',
          method: 'GET',
          headers: {
            Authorization: 'Bearer ' + token
          },
          success: function (res) {
            if (Array.isArray(res)) {
              const dataPenyewa = res.find(p => p.penyewa_id === penyewaId);

              if (dataPenyewa) {
                if (dataPenyewa.nama_kamar) {
                  $('.detail-kamar h3').text(dataPenyewa.nama_kamar);
                }

                if (dataPenyewa.tgl_masuk) {
                  const tanggal = new Date(dataPenyewa.tgl_masuk);
                  const options = { day: 'numeric', month: 'long', year: 'numeric' };
                  const formatted = tanggal.toLocaleDateString('id-ID', options);
                  $('.detail-kamar p:contains("Tanggal Masuk") strong').text(formatted);
                }
              } else {
                console.warn('Tidak ada pemesanan untuk penyewa ini');
              }
            }
          },
          error: function (xhr) {
            console.error('Gagal ambil pemesanan:', xhr.responseText);
          }
        });
      },
      error: function (xhr) {
        console.error('Gagal ambil user dari token:', xhr.responseText);
        Swal.fire('Gagal Ambil Data', 'Silakan login ulang.', 'error');
      }
    });
  });
</script>
