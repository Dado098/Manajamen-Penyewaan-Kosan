<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profil</title>
  <link rel="stylesheet" href="../css/editprofile.css" />
</head>
<body>
  <div class="container">
    <h1>Edit Profil</h1>
    <div class="form-box">
      <h2>Ubah Data Diri</h2>
      
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Masukkan email" />

      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap" />

      <label for="hp">Nomor Handphone</label>
      <input type="tel" id="hp" placeholder="Masukkan no. HP" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password" />

      <button class="edit-button">Simpan Profil</button>
    </div>
  </div>

  <script>
    // Cek jika ada data profil di LocalStorage saat halaman dimuat
    window.onload = function () {
      const userProfile = JSON.parse(localStorage.getItem("userProfile"));
      if (userProfile) {
        // Isi form dengan data profil yang ada
        document.getElementById("email").value = userProfile.email;
        document.getElementById("nama").value = userProfile.nama;
        document.getElementById("hp").value = userProfile.hp;
      }
    };

    // Ketika tombol Simpan Profil diklik
    document.querySelector(".edit-button").addEventListener("click", function (e) {
      e.preventDefault();

      // Ambil data dari input form
      const updatedProfile = {
        email: document.getElementById("email").value,
        nama: document.getElementById("nama").value,
        hp: document.getElementById("hp").value,
        password: document.getElementById("password").value
      };

      // Simpan data ke LocalStorage
      localStorage.setItem("userProfile", JSON.stringify(updatedProfile));

      // Arahkan kembali ke halaman profil
      window.location.href = "profile.html";
    });
  </script>
</body>
</html>
