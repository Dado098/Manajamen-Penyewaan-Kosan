<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Profil</title>
  <link rel="stylesheet" href="../css/editprofile.css" />
</head>
<body>
  <a href="profile.html" class="back-button">&lt;</a>

  <div class="container">
    <h1>Edit Profil</h1>

    <form id="edit-profile-form" class="form-box">
      <h2>Ubah Data Diri</h2>

      <label for="profile-email">Email</label>
      <input type="email" id="profile-email" placeholder="Masukkan email" />

      <label for="profile-nama">Nama Lengkap</label>
      <input type="text" id="profile-nama" placeholder="Masukkan nama lengkap" />

      <label for="profile-hp">Nomor Handphone</label>
      <input type="tel" id="profile-hp" placeholder="Masukkan no. HP" />

      <a href="edit-password.html" class="edit-password-link">Edit Password</a>

      <button type="submit" class="edit-button">Simpan Profil</button>
    </form>
  </div>
  
  </div>
  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>

  <script>
    $(document).ready(function () {
      const userToken = localStorage.getItem('token');
  
      if (!userToken) {
        Swal.fire({
          icon: 'error',
          title: 'Token Hilang',
          text: 'Silakan login kembali.'
        }).then(() => {
          window.location.href = "login.html";
        });
        return;
      }
  
      let token = userToken;
      try {
        const parsed = JSON.parse(userToken);
        if (parsed.token) {
          token = parsed.token;
        }
      } catch (e) {}
  
      // AMBIL DATA USER SAAT PERTAMA KALI MASUK
      $.ajax({
        url: 'http://localhost:8000/api/user',
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token
        },
        success: function (user) {
          $("#profile-email").val(user.email || "");
          $("#profile-nama").val(user.name || "");
          $("#profile-hp").val(user.no_telp || "");
  
          localStorage.setItem("userProfile", JSON.stringify(user));
          localStorage.setItem("userId", user.id); // <- SIMPAN ID DI LOCAL STORAGE
        },
        error: function () {
          Swal.fire({
            icon: 'error',
            title: 'Session Expired',
            text: 'Silakan login kembali.'
          }).then(() => {
            localStorage.removeItem("token");
            window.location.href = "login.html";
          });
        }
      });
  
      // KETIKA TOMBOL SIMPAN DIKLIK
      $("#edit-profile-form").on('submit', function (e) {
        e.preventDefault();
  
        const updatedData = {
          name: $("#profile-nama").val(),
          email: $("#profile-email").val(),
          no_telp: $("#profile-hp").val()
        };
  
        const userId = localStorage.getItem("userId"); // <- AMBIL ID
  
        $.ajax({
          url: 'http://localhost:8000/api/users/' + userId, // <- GUNAKAN ROUTE SESUAI CONTROLLER
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          data: JSON.stringify(updatedData),
          success: function () {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil',
              text: 'Profil berhasil diperbarui.'
            }).then(() => {
              location.reload();
            });
          },
          error: function (xhr) {
            Swal.fire({
              icon: 'error',
              title: 'Gagal Update',
              text: xhr.responseJSON?.message || 'Terjadi kesalahan.'
            });
          }
        });
      });
    });
  </script>
