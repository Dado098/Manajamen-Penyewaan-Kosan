<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Senangkos</title>
  <link rel="stylesheet" href="../css/register.css" />
  <!-- Include jQuery only once -->
  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>
</head>
<body>
  <!-- Your HTML content remains the same -->
  <div class="logo-top">
    <img src="../images/logo.png" alt="Logo Senangkos" class="logo-img" />
  </div>

  <div class="sign-up">
    <div class="form-container">
      <div class="form-box">
        <h2 class="form-title">Daftar Sekarang Juga!</h2>
        <input type="text" id="username" placeholder="Username" class="input" required />
        <input type="text" id="nama" placeholder="Nama" class="input" required />
        <input type="text" id="hp" placeholder="No. Telpon" class="input" required />
        <input type="email" id="email" placeholder="Email" class="input" required />
        <input type="password" id="password" placeholder="Password" class="input" required />
        <input type="password" id="password_confirmation" placeholder="Konfirmasi Password" class="input" required />
        <button id="btnRegister" class="register-button">Daftar</button>
        <p class="login-text">Sudah memiliki akun? <a href="login.html">Login di sini</a></p>
      </div>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      $('#btnRegister').on('click', function (e) {
        e.preventDefault();
   
        let name = $('#nama').val();
        let username = $('#username').val();
        let no_telp = $('#hp').val();
        let email = $('#email').val();
        let password = $('#password').val();
        let password_confirmation = $('#password_confirmation').val(); // Tambahkan konfirmasi password
        let role = 'penyewa';
   
        $.ajax({
          url: 'http://localhost:8000/api/register',
          type: 'POST',
          data: {
            name: name,
            username: username,
            no_telp: no_telp,
            email: email,
            password: password,
            password_confirmation: password_confirmation, // Kirimkan password_confirmation
            role: role
          },
          success: function (response) {
            Swal.fire({
              icon: 'success',
              title: 'Pendaftaran Berhasil!',
              html: 'Silakan cek email Anda untuk <b>verifikasi akun</b> terlebih dahulu. Setelah itu, Anda bisa login.',
            }).then(() => {
              window.location.href = 'login.html';
            });
          },
          error: function (xhr) {
            let message = 'Terjadi kesalahan saat mendaftar';
   
            try {
              if (xhr.responseJSON) {
                message = xhr.responseJSON.message || message;
                if (xhr.responseJSON.errors) {
                  let detail = '';
                  for (let key in xhr.responseJSON.errors) {
                    detail += `${xhr.responseJSON.errors[key][0]}<br>`;
                  }
                  message = detail || message;
                }
              }
            } catch (e) {
              console.error('Error parsing response:', e);
            }
   
            Swal.fire({
              icon: 'error',
              title: 'Gagal Daftar',
              html: message,
            });
          }
        });
      });
    });
   </script>
   
  

</body>
</html>
