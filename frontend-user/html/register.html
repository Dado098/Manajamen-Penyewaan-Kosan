<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Senangkos</title>
  <link rel="stylesheet" href="../css/register.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <!-- Logo di kiri atas -->
  <div class="logo-top">
    <img src="../images/logo.png" alt="Logo Senangkos" class="logo-img" />
  </div>

  <!-- Container form -->
  <div class="sign-up">
    <div class="form-container">
      <div class="form-box">
        <h2 class="form-title">Daftar Sekarang Juga!</h2>

        <input type="text" placeholder="Username" class="input" />
        <input type="text" placeholder="Nama" class="input" />
        <input type="text" placeholder="No. Telpon" class="input" />
        <input type="password" placeholder="Password" class="input" />

        <button class="register-button">Daftar</button>

        <p class="login-text">Sudah memiliki akun? <a href="login.html">Login di sini</a></p>
      </div>
    </div>
  </div>
</body>

  <script src="../js/register.js"></script>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>

  <script>
    $(document).ready(function () {
  $('#btnRegister').on('click', function (e) {
    e.preventDefault();

    let name = $('#nama').val();
    let username = $('#username').val();
    let no_telp = $('#hp').val();
    let password = $('#password').val();
    let role = 'penyewa'; // default role saat register (bisa disesuaikan)

    $.ajax({
      url: 'http://localhost:8000/api/register',
      method: 'POST',
      data: {
        name: name,
        username: username,
        no_telp: no_telp,
        password: password,
        role: role,
      },
      success: function (response) {
        Swal.fire({
          icon: 'success',
          title: 'Berhasil Daftar!',
          text: 'Silakan login untuk melanjutkan.',
        }).then(() => {
          window.location.href = 'login.html';
        });
      },
      error: function (xhr) {
        let errors = xhr.responseJSON.errors;
        let message = xhr.responseJSON.message || 'Terjadi kesalahan';

        let detail = '';
        for (let key in errors) {
          detail += `${errors[key][0]}<br>`;
        }

        Swal.fire({
          icon: 'error',
          title: 'Gagal Daftar',
          html: detail || message,
        });
      }
    });
  });
});

  </script>
</body>
</html>
