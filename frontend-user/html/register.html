<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Senangkos</title>
  <link rel="stylesheet" href="../css/register.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <div class="sign-up">
    <div class="div">


      <!-- Bagian Kanan (Sudah Punya Akun) -->
      <div class="overlap">

        <!-- Logo -->
        <div class="logo-wrapper">
          <img src="../images/logo.png" alt="Logo Senangkos" />
        </div>

        <!-- Teks dan tombol login -->
        <div class="text-wrapper">Sudah Punya Akun ?</div>
        <button class="button-primary-large" onclick="window.location.href='login.html'">Login</button>
      </div>

      <!-- Judul Atas -->
      <div class="text-wrapper-2">Selamat Datang di <br><strong>Senangkos</strong></div>

      <!-- Form Register -->
      <div class="overlap-group">
        <div class="popup-login">
          <h2 class="register-title">Register</h2>

          <input type="text" id="nama" placeholder="Nama Lengkap" class="input" />
          <input type="username" id="username" placeholder="Username" class="input" />
          <input type="text" id="hp" placeholder="Nomor Handphone" class="input" />
          <input type="password" id="password" placeholder="Password" class="input" />

          <button id="btnRegister" class="rectangle">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/register.js"></script>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/jquery-validation-1.19.5/jquery.validate.min.js"></script>
  <script src="../js/jquery-validation-1.19.5/additional-methods.min.js"></script>

  <script>
    $(document).ready(function () {
  $('#btnRegister').on('click', function (e) {
    e.preventDefault();

    let name = $('#nama').val();
    let username = $('#username').val();
    let no_telp = $('#hp').val();
    let password = $('#password').val();
    let role = 'penyewa'; // default role saat register (bisa disesuaikan)

    $.ajax({
      url: 'http://localhost:8000/api/register',
      method: 'POST',
      data: {
        name: name,
        username: username,
        no_telp: no_telp,
        password: password,
        role: role,
      },
      success: function (response) {
        Swal.fire({
          icon: 'success',
          title: 'Berhasil Daftar!',
          text: 'Silakan login untuk melanjutkan.',
        }).then(() => {
          window.location.href = 'login.html';
        });
      },
      error: function (xhr) {
        let errors = xhr.responseJSON.errors;
        let message = xhr.responseJSON.message || 'Terjadi kesalahan';

        let detail = '';
        for (let key in errors) {
          detail += `${errors[key][0]}<br>`;
        }

        Swal.fire({
          icon: 'error',
          title: 'Gagal Daftar',
          html: detail || message,
        });
      }
    });
  });
});

  </script>
</body>
</html>
