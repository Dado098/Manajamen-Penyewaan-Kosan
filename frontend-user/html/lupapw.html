<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Password</title>
  <link rel="stylesheet" href="../css/lupapw.css" />
</head>
<body>
  <a href="editprofile.html" class="back-button">&lt;</a>

<div class="container">
  <h1>Edit Password</h1>
  <form class="form-box" id="password-form">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Masukkan email Anda" required>

    <label for="new-password">Password Baru</label>
    <input type="password" id="new-password" placeholder="Masukkan password baru" required>

    <label for="confirm-password">Konfirmasi Password</label>
    <input type="password" id="confirm-password" placeholder="Konfirmasi password baru" required>

    <button type="submit" class="save-button">Simpan Password</button>
  </form>
</div>


  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
